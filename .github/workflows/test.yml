name: test
on: [pull_request]
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: test build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: "**/go.sum"
        id: go

      - name: build and test
        run: |
          make
          ./sacloud-otel-collector components
          ./sacloud-otel-collector --version
          make test

      - name: docker build test
        run: |
          mkdir -p dist/sacloud-otel-collector_linux_amd64
          cp ./sacloud-otel-collector dist/sacloud-otel-collector_linux_amd64/sacloud-otel-collector
          make docker-load
          docker run --rm ghcr.io/sacloud/sacloud-otel-collector:$VERSION --version
        env:
          VERSION: ${{ github.sha }}

  test-windows:
    name: test build (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"

      - name: build
        shell: bash
        run: |
          go build -o ../../sacloud-otel-collector$(go env GOEXE) .
          ../../sacloud-otel-collector$(go env GOEXE) components
          ../../sacloud-otel-collector$(go env GOEXE) --version
        working-directory: cmd/sacloud-otel-collector
