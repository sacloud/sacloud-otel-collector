extensions:
  file_storage:
    directory: /tmp

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  sacloud:
    sending_queue:
      storage: file_storage
    logs:
      endpoint: "123456789012"
      token: "test-token"
    traces:
      endpoint: "123456789012"
      token: "test-token"

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [sacloud]
    traces:
      receivers: [otlp]
      exporters: [sacloud]
